events {
    worker_connections 1024;
}

http {
    upstream overpass_backend {
        least_conn;  # Use least connections algorithm for better distribution

        # Docker Swarm uses DNS round-robin for service discovery
        # The service name resolves to all replica IPs
        server overpass:80 max_fails=3 fail_timeout=30s;

        keepalive 32;  # Keep connections alive for better performance
    }

    server {
        listen 80;
        server_name _;

        # Increase timeouts for long-running Overpass queries
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Increase buffer sizes for large responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        location / {
            proxy_pass http://overpass_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP/1.1 for keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Health check endpoint (optional)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
