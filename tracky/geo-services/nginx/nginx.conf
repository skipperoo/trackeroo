events {
    worker_connections 1024;
}

http {
    # Define cache path and settings
    proxy_cache_path /var/cache/nginx/overpass
                     levels=1:2
                     keys_zone=overpass_cache:100m
                     max_size=10g
                     inactive=7d
                     use_temp_path=off;

    upstream overpass_backend {
        least_conn;
        server overpass:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Enable request body caching
        client_body_buffer_size 1M;
        client_max_body_size 10M;

        # Increase timeouts for long-running Overpass queries
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;

        # Increase buffer sizes for large responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        location / {
            proxy_pass http://overpass_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HTTP/1.1 for keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Cache configuration
            proxy_cache overpass_cache;

            # CRITICAL: Cache key must include request body for POST requests
            proxy_cache_key "$request_method$request_uri$request_body";

            # Cache GET and POST requests
            proxy_cache_methods GET HEAD POST;

            proxy_cache_valid 200 1h;      # Cache successful responses for 1 hour
            proxy_cache_valid 404 10m;     # Cache 404s for 10 minutes
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;           # Prevent cache stampede

            # Add cache status header for debugging
            add_header X-Cache-Status $upstream_cache_status;

            # Ignore cache control from backend
            proxy_ignore_headers Cache-Control Expires;
        }

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Cache stats endpoint (optional)
        location /cache-stats {
            allow 127.0.0.0/8;
            allow 172.0.0.0/8;
            deny all;

            stub_status;
        }
    }

    # Logging with cache status
    log_format cache_log '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'Cache: $upstream_cache_status';

    access_log /var/log/nginx/access.log cache_log;
    error_log /var/log/nginx/error.log warn;
}
