name: Build and Push Docker Images

on:
  push:
    branches: [master, ls-dev]
    paths:
      - "tsdb/**"
      - "trackeroo-backend/**"
      - "brokeroo/**"
      - "flink_job/**"
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed images
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          filters: |
            tsdb:
              - 'tsdb/**'
            trackeroo-backend:
              - "trackeroo-backend/**"
            brokeroo:
              - "brokeroo/**"
            flink_job:
              - "flink_job/**"

  build:
    needs: detect
    if: needs.detect.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: tsdb
            context: ./tsdb
            dockerfile: ./tsdb/Dockerfile
          - image: trackeroo-backend
            context: ./trackeroo-backend/src
            dockerfile: ./trackeroo-backend/src/Dockerfile
          - image: brokeroo
            context: ./brokeroo
            dockerfile: ./brokeroo/Dockerfile
          - image: flink_job
            context: ./flink_job
            dockerfile: ./flink_job/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        retry: 3

      - name: Read version.yml
        id: version
        run: |
          VERSION=$(yq e '.version' ${{ matrix.context }}/version.yml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}

