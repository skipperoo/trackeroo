services:
  trackeroo-backend:
    container_name: trackeroo-backend
    restart: no
    build:
      context: trackeroo-backend/src
      dockerfile: Dockerfile
    healthcheck:
      test: nc -z localhost 8080
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - users_key
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/trackeroo
      LOG_LEVEL: debug
      MQTT_HOST: localhost
      MQTT_PORT: 1883
      MQTTS_PORT: 8883
    volumes:
      - trackeroo-backend-data:/app/data
      - ./trackeroo-backend/certs:/certs:ro

  redis:
    container_name: redis
    image: redis:8.2.1-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: no

  mongo:
    container_name: mongo
    image: mongo:latest
    restart: no
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongo-data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "8083:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
    depends_on:
      - mongo

  rabbitmq:
    image: rabbitmq:3-management
    restart: no
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "1883:1883"
      - "8883:8883"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbitmq_mqtt tcp_listeners [{"0.0.0.0",1883}]'
    volumes:
      - ./rabbitmq/etc:/etc/rabbitmq/
      - rabbitmq-data:/var/lib/rabbitmq
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_mqtt;
              rabbitmq-server"

  tsdb:
    container_name: tsdb
    restart: no
    build:
      context: tsdb
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracker_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb,pg_cron"]
    environment:
      POSTGRES_DB: tracker_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./tsdb/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: no
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8085:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      tsdb:
        condition: service_healthy

  brokeroo:
    container_name: brokeroo
    restart: no
    build:
      context: brokeroo
      dockerfile: Dockerfile
    environment:
      MQTT_BROKER: mqtt://rabbitmq:1883
      MQTT_CLIENT_ID: apps
      MQTT_USERNAME: "apps"
      MQTT_PASSWORD: "apps"
      POSTGRES_URL: postgres://apps:apps@tsdb:5432/tracker_db?sslmode=disable
      TOPIC_PATTERN: j/data/+/+
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka:
        condition: service_started
      tsdb:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: no
    depends_on:
      tsdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: tsdb:5432
      GF_DATABASE_NAME: tracker_db
      GF_DATABASE_USER: admin
      GF_DATABASE_PASSWORD: administrator
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    depends_on:
      - zookeeper

  flink-jobmanager:
    image: flink:1.20.0-scala_2.12
    platform: linux/amd64
    ports:
      - "8081:8081" # dashboard web di Flink
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    depends_on:
      - kafka
      - tsdb

  flink-taskmanager:
    image: flink:1.20.0-scala_2.12
    platform: linux/amd64
    command: taskmanager
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 16
    depends_on:
      - flink-jobmanager

  flink-job:
    container_name: flink-job
    build:
      context: ./flink_job
      dockerfile: Dockerfile
    depends_on:
      - flink-jobmanager
      - flink-taskmanager
      - kafka
      - tsdb
    environment:
      - FLINK_JM_HOST=flink-jobmanager
      - FLINK_JM_PORT=8081
      - FLINK_PARALLELISM=16
      - POSTGRES_URL=jdbc:postgresql://tsdb:5432/tracker_db?sslmode=disable

volumes:
  trackeroo-backend-data:
  mongo-data:
  rabbitmq-data:
  tsdb-data:
  pgadmin-data:
  grafana-data:
  redis-data:

secrets:
  users_key:
    file: trackeroo-backend/secrets/users_key
