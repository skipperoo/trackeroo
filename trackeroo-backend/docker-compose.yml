services:
  trackeroo-backend:
    build:
      context: src
      dockerfile: Dockerfile
    healthcheck:
      test: nc -z localhost 8080
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    secrets:
      - users_key
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/trackeroo
      LOG_LEVEL: debug
      MQTT_HOST: localhost
      MQTT_PORT: 1883
      MQTTS_PORT: 8883
    volumes:
      - trackeroo-backend-data:/app/data

  mongo:
    image: mongo:latest
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongo-data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "1883:1883"
      - "8883:8883"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbitmq_mqtt tcp_listeners [{"0.0.0.0",1883}]'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/etc:/etc/rabbitmq/

  tsdb:
    image: ghcr.io/skiby7/tsdb:latest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracker_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: tsdb
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_DB: tracker_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./tsdb/initdb:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8085:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      tsdb:
        condition: service_healthy

  test-db-ingestion:
    build:
      context: brokeroo
      dockerfile: Dockerfile
    environment:
      MQTT_BROKER: mqtt://rabbitmq:1883
      MQTT_CLIENT_ID: apps
      MQTT_USERNAME: "apps"
      MQTT_PASSWORD: "apps"
      POSTGRES_URL: postgres://admin:administrator@tsdb:5432/tracker_db?sslmode=disable
      TOPIC_PATTERN: j/data/+/+
    depends_on:
      kafka: 
        condition: service_started
      tsdb:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      tsdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: tsdb:5432
      GF_DATABASE_NAME: tracker_db
      GF_DATABASE_USER: admin
      GF_DATABASE_PASSWORD: administrator
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT 
    depends_on:
      - zookeeper

volumes:
  trackeroo-backend-data:
  mongo-data:
  rabbitmq-data:
  tsdb-data:
  pgadmin-data:
  grafana-data:

secrets:
  users_key:
    file: secrets/users_key