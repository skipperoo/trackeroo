namespace: data
cluster_name: tsdb
instances: 3
image: ghcr.io/yourorg/pg16-ts-postgis:16.4-2.15.3-3.4
storage_size: 200Gi
storage_class: longhorn
database_name: appdb
database_user: appuser
secret_name: tsdb-app-creds
backup_bucket: s3://my-bucket/tsdb/
backup_schedule: "0 2 * * *"
synchronous_method: any
synchronous_number: 1
data_durability: required
max_connections: 300
