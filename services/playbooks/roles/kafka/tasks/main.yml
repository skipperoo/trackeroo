- name: "Create Kafka namespace"
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    name: "{{ kafka_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: "Deploy Zookeeper and Kafka"
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    namespace: "{{ kafka_namespace }}"
    definition: "{{ lookup('template', item) | from_yaml }}"
  loop:
    - "01-zookeeper-deployment.yml.j2"
    - "02-zookeeper-service.yml.j2"
    - "03-kafka-deployment.yml.j2"
    - "04-kafka-service.yml.j2"
