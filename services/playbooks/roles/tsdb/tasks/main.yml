---
- name: Ensure CNPG namespace exists
  k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ cnpg_namespace }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Apply CNPG operator bundle
  k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    src: "{{ cnpg_operator_url }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Wait for CNPG Cluster CRD to be available
  k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
  register: cnpg_crd
  retries: 10
  delay: 5
  until: cnpg_crd.resources is defined
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Wait for CNPG operator pod to be running
  k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    kind: Pod
    namespace: "{{ cnpg_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=cloudnative-pg
  register: cnpg_operator
  retries: 10
  delay: 5
  until: cnpg_operator.resources | length > 0 and
    cnpg_operator.resources[0].status.phase == "Running"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Ensure namespace exists
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Namespace
    name: "{{ tsdb_namespace }}"
    state: present
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Create admin user credentials secret
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ cluster_name }}-admin-secret"
        namespace: "{{ tsdb_namespace }}"
      type: kubernetes.io/basic-auth
      stringData:
        username: "{{ admin_user | default('admin') }}"
        password: "{{ admin_password }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Create apps user credentials secret
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ cluster_name }}-apps-secret"
        namespace: "{{ tsdb_namespace }}"
      type: kubernetes.io/basic-auth
      stringData:
        username: "{{ apps_user | default('apps') }}"
        password: "{{ apps_password }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Apply PostgreSQL cluster manifest
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ lookup('template', 'tsdb-cluster.yml.j2') }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Wait for PostgreSQL cluster to be ready
  k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ cluster_name }}"
    namespace: "{{ tsdb_namespace }}"
  register: postgres_cluster
  retries: 30
  delay: 20
  until: postgres_cluster.resources | length > 0 and
    postgres_cluster.resources[0].status is defined
    and
    postgres_cluster.resources[0].status.phase is defined
    and
    postgres_cluster.resources[0].status.phase == "Creating a new replica"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Grant database access to managed users
  kubernetes.core.k8s_exec:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    namespace: "{{ tsdb_namespace }}"
    pod: "{{ cluster_name }}-1"
    command: >
      psql -U postgres -d {{ database_name }} -c "
      -- Admin user gets full privileges
      GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ admin_user }};

      -- Apps user gets full read/write access
      GRANT ALL PRIVILEGES ON DATABASE {{ database_name }} TO {{ apps_user }};
      GRANT ALL ON SCHEMA public TO {{ apps_user }};
      GRANT ALL ON ALL TABLES IN SCHEMA public TO {{ apps_user }};
      GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO {{ apps_user }};
      GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO {{ apps_user }};

      -- Ensure apps user gets permissions on future objects
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ apps_user }};
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ apps_user }};
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO {{ apps_user }};

      -- TimescaleDB specific permissions
      GRANT USAGE ON SCHEMA _timescaledb_catalog TO {{ apps_user }};
      GRANT USAGE ON SCHEMA _timescaledb_config TO {{ apps_user }};
      GRANT USAGE ON SCHEMA _timescaledb_internal TO {{ apps_user }};
      GRANT SELECT ON ALL TABLES IN SCHEMA _timescaledb_catalog TO {{ apps_user }};
      GRANT SELECT ON ALL TABLES IN SCHEMA _timescaledb_config TO {{ apps_user }};
      "
  delegate_to: "{{ groups['servers'][0] }}"
  retries: 5
  delay: 10
  register: grant_result
  until: grant_result is not failed
  run_once: true
