---
- name: Ensure CNPG namespace exists
  k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ cnpg_namespace }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Apply CNPG operator bundle
  k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    src: "{{ cnpg_operator_url }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Wait for CNPG Cluster CRD to be available
  k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
  register: cnpg_crd
  retries: 10
  delay: 5
  until: cnpg_crd.resources is defined
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Wait for CNPG operator pod to be running
  k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    kind: Pod
    namespace: "{{ cnpg_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=cloudnative-pg
  register: cnpg_operator
  retries: 10
  delay: 5
  until: cnpg_operator.resources | length > 0 and
    cnpg_operator.resources[0].status.phase == "Running"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Ensure namespace exists
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: v1
    kind: Namespace
    name: "{{ tsdb_namespace }}"
    state: present
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Create admin user credentials secret
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ cluster_name }}-admin-secret"
        namespace: "{{ tsdb_namespace }}"
      type: kubernetes.io/basic-auth
      stringData:
        username: "{{ admin_user | default('admin') }}"
        password: "{{ admin_password }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Create apps user credentials secret
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ cluster_name }}-apps-secret"
        namespace: "{{ tsdb_namespace }}"
      type: kubernetes.io/basic-auth
      stringData:
        username: "{{ apps_user | default('apps') }}"
        password: "{{ apps_password }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Create init scripts ConfigMap
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ cluster_name }}-init-scripts"
        namespace: "{{ tsdb_namespace }}"
      data:
        01-init.sql: "{{ lookup('file', '01-init.sql') }}"
        02-schema.sql: "{{ lookup('file', '02-schema.sql') }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Apply PostgreSQL cluster manifest
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition: "{{ lookup('template', 'tsdb-cluster.yml.j2') }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Wait for PostgreSQL cluster to be ready
  k8s_info:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    api_version: postgresql.cnpg.io/v1
    kind: Cluster
    name: "{{ cluster_name }}"
    namespace: "{{ tsdb_namespace }}"
  register: postgres_cluster
  retries: 30
  delay: 20
  until: postgres_cluster.resources | length > 0 and
    postgres_cluster.resources[0].status is defined
    and
    postgres_cluster.resources[0].status.phase is defined
    and
    postgres_cluster.resources[0].status.phase == "Creating a new replica"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true
