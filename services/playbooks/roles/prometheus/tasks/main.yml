---
- name: "Create Prometheus Kubernetes namespace"
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    name: "{{ prometheus_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: "Deploy Prometheus components"
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    namespace: "{{ prometheus_namespace }}"
    definition: "{{ lookup('template', item) | from_yaml }}"
  loop:
    - "01-configmap.yml.j2"
    - "02-sa.yml.j2"
    - "03-role.yml.j2"
    - "04-rolebinding.yml.j2"
    - "05-deployment.yml.j2"
    - "06-service.yml.j2"
