- name: Ensure Helm present (install if missing)
  shell: |
    if ! command -v helm >/dev/null 2>&1; then
      curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    fi
  args:
    creates: /usr/local/bin/helm

- name: Add Longhorn helm repo
  shell: helm repo add longhorn https://charts.longhorn.io
  args:
    warn: false

- name: Update helm repos
  shell: helm repo update
  args:
    warn: false

- name: Install Longhorn in longhorn-system namespace
  shell: >
    helm upgrade --install longhorn longhorn/longhorn
      --namespace longhorn-system --create-namespace
      --set persistence.defaultClass=true
  args:
    warn: false

- name: Create a NodeSelector/DaemonSet label for longhorn disks on all nodes
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml label node {{ inventory_hostname }} longhorn-node=ready --overwrite
  when: "'nodes' not in group_names" # only run from control host once
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Patch Longhorn settings to allow using raw devices
  shell: |
    # Longhorn will discover block devices automatically in many cases,
    # but you may want to set the disks via the UI or automation.
    # This placeholder keeps room for automation (advanced).
    true
  args:
    warn: false
