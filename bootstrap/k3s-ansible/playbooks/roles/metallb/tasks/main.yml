---
- name: Check if this server is the first master (server1)
  set_fact:
    is_first_server: "{{ inventory_hostname == groups['servers'][0] }}"

- name: Create manifests directory on first master
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    owner: root
    group: root
    mode: "0644"
  when: is_first_server

- name: "Download to first master: manifest for metallb-{{ metal_lb_type }}"
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/metallb/metallb/{{ metal_lb_controller_tag_version }}/config/manifests/metallb-{{ metal_lb_type }}.yaml # noqa yaml[line-length]
    dest: /var/lib/rancher/k3s/server/manifests/metallb-crds.yaml
    owner: root
    group: root
    mode: "0644"
  when: is_first_server

- name: Set image versions in manifest for metallb-{{ metal_lb_type }}
  ansible.builtin.replace:
    path: /var/lib/rancher/k3s/server/manifests/metallb-crds.yaml
    regexp: "{{ item.change | ansible.builtin.regex_escape }}"
    replace: "{{ item.to }}"
  with_items:
    - change: metallb/speaker:{{ metal_lb_controller_tag_version }}
      to: metallb/speaker:{{ metal_lb_speaker_tag_version }}
  loop_control:
    label: "{{ item.change }} => {{ item.to }}"
  when: is_first_server

- name: Add tolerations to MetalLB manifest to run on servers
  ansible.builtin.replace:
    path: /var/lib/rancher/k3s/server/manifests/metallb-crds.yaml
    # This regex finds the line with 'containers:' and inserts the tolerations block before it.
    # The '(\s+)' capture group preserves the correct indentation.
    regexp: '^(\s+)containers:'
    replace: |
      \1tolerations:
      \1# This toleration allows scheduling on nodes with the taint K3s adds.
      \1- key: "CriticalAddonsOnly"
      \1  operator: "Exists"
      \1# These tolerations are for standard Kubernetes control-plane taints.
      \1- key: "node-role.kubernetes.io/master"
      \1  operator: "Exists"
      \1  effect: "NoSchedule"
      \1- key: "node-role.kubernetes.io/control-plane"
      \1  operator: "Exists"
      \1  effect: "NoSchedule"
      \1containers:
  when: is_first_server

- name: Create MetalLB IPAddressPool configuration
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/metallb-ippool.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: default-pool
        namespace: metallb-system
      spec:
        addresses:
        - {{ metallb_ip_range }}
  when: is_first_server

- name: Create MetalLB L2Advertisement configuration
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/metallb-l2advertisement.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: default-advertisement
        namespace: metallb-system
      spec:
        ipAddressPools:
        - default-pool
        interfaces:
        - {{ metallb_interface }}

  when: is_first_server
