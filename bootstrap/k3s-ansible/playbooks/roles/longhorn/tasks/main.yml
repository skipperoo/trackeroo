---
- name: Unmount /var/lib/longhorn if currently mounted
  mount:
    path: "{{ longhorn_path }}"
    state: unmounted
  ignore_errors: true
  when: inventory_hostname in groups['nodes']

- name: Delete everything under /var/lib/longhorn
  file:
    path: "{{ longhorn_path }}"
    state: absent
  when: inventory_hostname in groups['nodes']

- name: Recreate /var/lib/longhorn directory
  file:
    path: "{{ longhorn_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname in groups['nodes']

- name: Create filesystem on disk if not exists
  filesystem:
    fstype: "ext4"
    dev: "{{ longhorn_disk }}"
    force: no
  when: inventory_hostname in groups['nodes']

- name: Mount disk to /var/lib/longhorn
  mount:
    path: "{{ longhorn_path }}"
    src: "{{ longhorn_disk }}"
    fstype: "ext4"
    opts: "defaults"
    state: mounted
  when: inventory_hostname in groups['nodes']

- name: Ensure mount persists after reboot
  mount:
    path: "{{ longhorn_path }}"
    src: "{{ longhorn_disk }}"
    fstype: "ext4"
    opts: "defaults"
    state: present
  when: inventory_hostname in groups['nodes']

- name: Set proper ownership on mounted directory
  file:
    path: "{{ longhorn_path }}"
    owner: "root"
    group: "root"
    mode: "0755"
    recurse: true
  when: inventory_hostname in groups['nodes']

- name: Add Longhorn Helm repo
  command: helm repo add longhorn https://charts.longhorn.io
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Update Helm repos
  command: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Install Longhorn via Helm
  command: >
    helm upgrade --install longhorn longhorn/longhorn
    --namespace longhorn-system
    --create-namespace
    --set defaultSettings.createDefaultDiskLabeledNodesOnly=true
    --set defaultSettings.defaultDataPath=/var/lib/longhorn
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Label worker nodes for Longhorn disk config
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ item }}"
        labels:
          node.longhorn.io/create-default-disk-config: "true"
  loop: "{{ groups['nodes'] }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Disable Longhorn disk config on server nodes
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: v1
      kind: Node
      metadata:
        name: "{{ item }}"
        labels:
          node.longhorn.io/create-default-disk-config: "false"
  loop: "{{ groups['servers'] }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Disable Longhorn scheduling on control-plane nodes
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: longhorn.io/v1beta2
      kind: Node
      metadata:
        name: "{{ item }}"
        namespace: longhorn-system
      spec:
        name: "{{ item }}"
        allowScheduling: false

  loop: "{{ groups['servers'] }}"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Remove local-path as default StorageClass
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Set Longhorn as default StorageClass
  kubernetes.core.k8s:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: longhorn
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
      provisioner: driver.longhorn.io
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true

- name: Create Longhorn UI LoadBalancer service
  shell: |
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: Service
    metadata:
      name: longhorn-frontend-lb
      namespace: longhorn-system
    spec:
      type: LoadBalancer
      loadBalancerIP: {{ longhorn_ui_ip }}
      ports:
        - port: 80
          targetPort: 8000
      selector:
        app: longhorn-ui
    EOF
  delegate_to: "{{ groups['servers'][0] }}"
  run_once: true
