- name: Wait for the API VIP to be reachable (kube-vip must be up)
  wait_for:
    host: "{{ kube_api_vip }}"
    port: 6443
    timeout: 300

- name: Read token generated on the first server (pull over SSH)
  delegate_to: "{{ groups['servers'][0] }}"
  slurp:
    src: "{{ k3s_token_file }}"
  register: leader_token

- name: Install k3s agent
  become: true
  shell: |
    curl -sfL https://get.k3s.io | K3S_URL="https://{{ kube_api_vip }}:6443" \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      K3S_TOKEN="{{ leader_token.content | b64decode | trim }}" \
      sh -s - agent --node-ip {{ hostvars[inventory_hostname].internal_ip }} --kubelet-arg node-status-update-frequency=5s
  args:
    creates: /etc/rancher/k3s
