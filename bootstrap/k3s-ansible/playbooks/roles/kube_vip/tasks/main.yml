---
- name: Check if this server is the first master (server1)
  set_fact:
    is_first_server: "{{ inventory_hostname == groups['servers'][0] }}"

- name: Wait for k3s to be ready
  wait_for:
    port: 6443
    host: "{{ hostvars[inventory_hostname].internal_ip }}"
    delay: 10
    timeout: 120

- name: Create manifests directory on first master
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    owner: root
    group: root
    mode: "0644"
  when: is_first_server

- name: Download vip rbac manifest to first master
  ansible.builtin.get_url:
    url: https://kube-vip.io/manifests/rbac.yaml
    dest: /var/lib/rancher/k3s/server/manifests/vip-rbac.yaml
    owner: root
    group: root
    mode: "0644"
  when: is_first_server

- name: Copy vip manifest to first master
  ansible.builtin.template:
    src: vip.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/vip.yaml
    owner: root
    group: root
    mode: "0644"
  when: is_first_server

- name: Wait for kube-vip VIP to be available
  wait_for:
    host: "{{ kube_vip_vip }}"
    port: 6443
    delay: 10
    timeout: 120
  run_once: true

- name: Replace server IP in kubeconfig with VIP
  replace:
    path: /etc/rancher/k3s/k3s.yaml
    regexp: "server: https://127.0.0.1:6443"
    replace: "server: https://{{ kube_api_vip }}:6443"
  run_once: true
