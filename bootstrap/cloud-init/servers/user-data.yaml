#cloud-config
# Basic system configuration
timezone: Europe/Rome
locale: en_US.UTF-8
# User configuration
users:
  - name: k3s-admin
    passwd: $6$rounds=4096$B9SFui0p6YaAGZAF$PVHzzOun0HNCAOY4G6aJs.2EqXNwJiD3CE4/IFlaUs6e6HNGDl0CzpTmzkwTsBCUD4DLt5bFvn2q4fW5nFKBS0
    lock_passwd: false
    groups: sudo
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII6/cdK31gsONZhnyDTUf1/lyVY5mg23jyWurMzyLITJ sdcadmin@loginnode
    bashrc: |
  # Create .bashrc with proper content
  - |
    cat > /home/k3s-admin/.bashrc << 'EOF'
    # ~/.bashrc: executed by bash(1) for non-login shells.

    # If not running interactively, don't do anything
    case $- in
        *i*) ;;
          *) return;;
    esac

    # don't put duplicate lines or lines starting with space in the history.
    HISTCONTROL=ignoreboth

    # append to the history file, don't overwrite it
    shopt -s histappend

    # for setting history length see HISTSIZE and HISTFILESIZE in bash(1)
    HISTSIZE=1000
    HISTFILESIZE=2000

    # check the window size after each command and, if necessary,
    # update the values of LINES and COLUMNS.
    shopt -s checkwinsize

    # make less more friendly for non-text input files, see lesspipe(1)
    [ -x /usr/bin/lesspipe ] && eval "$(SHELL=/bin/sh lesspipe)"

    # set variable identifying the chroot you work in (used in the prompt below)
    if [ -z "${debian_chroot:-}" ] && [ -r /etc/debian_chroot ]; then
        debian_chroot=$(cat /etc/debian_chroot)
    fi

    # set a fancy prompt (non-color, unless we know we "want" color)
    case "$TERM" in
        xterm-color|*-256color) color_prompt=yes;;
    esac

    if [ -n "$force_color_prompt" ]; then
        if [ -x /usr/bin/tput ] && tput setaf 1 >&/dev/null; then
            color_prompt=yes
        else
            color_prompt=
        fi
    fi

    if [ "$color_prompt" = yes ]; then
        PS1='${debian_chroot:+($debian_chroot)}\[\033[01;32m\]\u@\h\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]\$ '
    else
        PS1='${debian_chroot:+($debian_chroot)}\u@\h:\w\$ '
    fi
    unset color_prompt force_color_prompt

    # If this is an xterm set the title to user@host:dir
    case "$TERM" in
    xterm*|rxvt*)
        PS1="\[\e]0;${debian_chroot:+($debian_chroot)}\u@\h: \w\a\]$PS1"
        ;;
    *)
        ;;
    esac

    # enable color support of ls and also add handy aliases
    if [ -x /usr/bin/dircolors ]; then
        test -r ~/.dircolors && eval "$(dircolors -b ~/.dircolors)" || eval "$(dircolors -b)"
        alias ls='ls --color=auto'
        alias dir='dir --color=auto'
        alias vdir='vdir --color=auto'
    fi

    # Alias definitions.
    # You may want to put all your additions into a separate file like
    # ~/.bash_aliases, instead of adding them here directly.
    if [ -f ~/.bash_aliases ]; then
        . ~/.bash_aliases
    fi

    # enable programmable completion features (you don't need to enable
    # this, if it's already enabled in /etc/bash.bashrc and /etc/profile
    # sources /etc/bash.bashrc).
    if ! shopt -oq posix; then
      if [ -f /usr/share/bash-completion/bash_completion ]; then
        . /usr/share/bash-completion/bash_completion
      elif [ -f /etc/bash_completion ]; then
        . /etc/bash_completion
      fi
    fi
    EOF

# SSH configuration
ssh_pwauth: false
disable_root: true
ssh_deletekeys: true
ssh_genkeytypes: ["rsa", "ecdsa", "ed25519"]
# Package updates and installations
package_update: true
package_upgrade: true
packages:
  - curl
  - wget
  - git
  - htop
  - vim
  - nano
  - tree
  - zip
  - unzip
  - build-essential
  - apt-transport-https
  - ca-certificates
  - gnupg
  - lsb-release
  - unattended-upgrades
  - conntrack
  - ipset
  - ipvsadm
  - jq
  - nfs-common
  - open-iscsi
# Write configuration files
write_files:
  # Custom motd
  - path: /etc/motd
    content: |
      ================================
      SUBEMELARADIO - K3S SERVER
      ================================
      Please think twice before running any commands and always check paths!
      System configured with cloud-init
      Useful commands:
        - kubectl get nodes
        - systemctl status k3s
        - journalctl -u k3s -f
    permissions: "0644"

runcmd:
  # Update system
  - apt-get update
  - apt-get upgrade -y
  - apt-get autoremove -y
  - apt-get autoclean
  - apt-get purge -y isc-dhcp-client
  - apt-get purge -y isc-dhcp-common
  # Configure unattended upgrades
  - echo 'Unattended-Upgrade::Automatic-Reboot "false";' >> /etc/apt/apt.conf.d/50unattended-upgrades
  - echo 'Unattended-Upgrade::Remove-Unused-Dependencies "true";' >> /etc/apt/apt.conf.d/50unattended-upgrades
  - systemctl enable unattended-upgrades
  # Optimize system for K3s
  - echo 'net.bridge.bridge-nf-call-iptables = 1' >> /etc/sysctl.conf
  - echo 'net.ipv4.ip_forward = 1' >> /etc/sysctl.conf
  - sysctl -p
# System configuration
bootcmd:
  - echo 'Initializing system...' > /var/log/cloud-init-bootcmd.log
# Power state (optional - uncomment if you want to reboot after setup)
# power_state:
#   mode: reboot
#   message: "Rebooting after cloud-init setup"
#   timeout: 30
#   condition: true
# Final message
final_message: |
  ========================================
  VM setup completed successfully!
  ========================================
  System Information:
  - User: k3s-admin
  - SSH: Key-based authentication enabled
  - Automatic updates: Enabled
  To connect:
    ssh k3s-admin@<vm-ip>
  System is ready for K3s deployment!
  ========================================
